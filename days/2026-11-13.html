  <h2><a href="../notes/20261112-rethinking-claude-code-best-practices-lydia-hallie-anthropic.html">사람이 루프에서 빠진 뒤의 Claude Code 사용법</a></h2>
  <p class="lead">모델이 좋아지면서 사람은 매 단계를 승인하는 자리에서 물러났다. 예전에 사람이 하던 조종, 승인, 제한, 확인, 시작은 사라지지 않았다. 모델, 하네스, 실행 환경이 나눠 맡는다. 이 발표는 그 일을 어디에 어떻게 넘기는지 차례로 보여 준다.</p>
